[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# The URL is supplied at runtime from Settings (see alembic/env.py) so that the
# database password is never written to a file in the repository.
sqlalchemy.url =

# No post-write hooks: run `make format` after generating a revision. A hook
# pointing at a venv binary breaks inside the container, where the path differs.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
